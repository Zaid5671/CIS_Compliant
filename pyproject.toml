[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cisguard"
version = "0.5.0"
description = "CISGuard - Automated CIS Benchmark Compliance & Hardening Auditor for OS, Firewalls, and Network Devices"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Zaid" }
]
keywords = ["security", "cis", "benchmark", "audit", "hardening", "ssh", "compliance", "scanner", "devsecops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Zaid5671/CIS_Compliant"
Repository = "https://github.com/Zaid5671/CIS_Compliant"
Issues = "https://github.com/Zaid5671/CIS_Compliant/issues"
Changelog = "https://github.com/Zaid5671/CIS_Compliant/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Unlocks SSH password authentication for remote scans (key auth needs nothing).
ssh-password = ["paramiko>=3"]
dev = ["ruff>=0.6", "build>=1.2", "paramiko>=3"]

[project.scripts]
cisguard = "omnibench.entry:main"
omnibench = "omnibench.entry:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["omnibench*"]
exclude = ["tests*", "deploy*"]

[tool.setuptools.package-data]
omnibench = [
  "static/*",
  "static/fonts/*.woff2",
  "data/sample_benchmarks/*.json",
  "data/checks/*.ps1",
]
