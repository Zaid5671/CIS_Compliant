name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall -q omnibench
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the built wheel
        run: pip install dist/*.whl
      - name: Smoke-check the CLI + packaged data
        run: |
          omnibench --version
          python -c "from omnibench.paths import SAMPLE_DIR; import glob; n=len(glob.glob(str(SAMPLE_DIR / '*.json'))); print('bundled benchmarks:', n); assert n >= 30"
          python -c "from omnibench.paths import STATIC_DIR; assert (STATIC_DIR / 'fonts' / 'jetbrains-mono-700.woff2').exists(), 'fonts missing from package data'"
